# NuroFlow edge: serves the dashboard and reverse-proxies the API.
# TLS terminates in front of this (Caddy in the `tls` compose profile, or your load
# balancer). This server speaks plain HTTP on the internal network only.

upstream nuroflow_api {
    server api:8000;
    keepalive 32;
}

map $sent_http_content_type $nf_csp {
    # The SPA: everything from our own origin. No inline scripts, no third parties.
    default "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'none'; form-action 'self'; frame-ancestors 'none'";
}

server {
    listen 8080;
    server_name _;
    server_tokens off;

    root /usr/share/nginx/html;
    client_max_body_size 1m;           # API payloads are small; uploads aren't a feature

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Headers for everything nginx serves itself (the API adds its own for /api).
    add_header Content-Security-Policy $nf_csp always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;

    location = /nginx-health { access_log off; return 200 "ok\n"; }

    # Prometheus scrapes api:8000/metrics on the internal network. It is never public.
    location = /metrics { return 404; }

    # ---------------------------------------------------------------- API
    location /api/ {
        proxy_pass http://nuroflow_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        # OVERWRITE (never append) the client address: the API trusts this header, so
        # a client-supplied X-Forwarded-For must not survive the edge.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_set_header X-Request-ID $request_id;
        proxy_read_timeout 60s;
    }

    # Live streams (SSE): no buffering, long reads. The API caps a stream at 30 min.
    location ~ ^/api/v1/(runs/[^/]+/stream|task-runs/[^/]+/logs/stream)$ {
        proxy_pass http://nuroflow_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
    }

    # Signed webhooks: the API enforces 256 KB too; reject bigger bodies at the edge.
    location ~ ^/api/v1/hooks/ {
        client_max_body_size 256k;
        proxy_pass http://nuroflow_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    }

    location ~ ^/(healthz|readyz)$ { proxy_pass http://nuroflow_api; access_log off; }

    # ---------------------------------------------------------------- SPA
    # Hashed bundles never change: cache for a year.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header Content-Security-Policy $nf_csp always;
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    # Client-side routes fall back to index.html, which is never cached, so a deploy
    # takes effect on the next page load.
    location / {
        add_header Cache-Control "no-cache" always;
        add_header Content-Security-Policy $nf_csp always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "no-referrer" always;
        try_files $uri $uri/ /index.html;
    }
}
