[project]
name = "nuroflow"
version = "0.1.0"
description = "NuroFlow — a durable, AI-native workflow orchestration platform."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Jonathan Scott" }]
classifiers = [
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Framework :: FastAPI",
    "Typing :: Typed",
]

# Each phase appends its own block, so the history shows *why* every dependency exists.
dependencies = [
    # Phase 1: data layer + configuration
    "sqlalchemy>=2.0.36,<2.1",
    "psycopg[binary]>=3.2,<4",
    "alembic>=1.14,<2",
    "pydantic>=2.9,<3",
    "pydantic-settings>=2.6,<3",
    # Phase 2: API, authentication, rate limiting
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.32,<1",
    "argon2-cffi>=23.1,<26",
    "pyjwt>=2.9,<3",
    "redis>=5.2,<7",
    "email-validator>=2.2,<3",
    # Phase 3: workflow engine, operators, workers
    "celery[redis]>=5.4,<6",
    "jinja2>=3.1,<4",
    "jsonschema>=4.23,<5",
    "croniter>=5.0,<7",
    "httpx>=0.27,<1",
    "pyyaml>=6.0,<7",
    # Phase 4: scheduler, webhooks (secret encryption)
    "cryptography>=43,<47",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "ruff>=0.8",
    "mypy>=1.13",
    "pre-commit>=4.0",
    "pytest-asyncio>=0.24",  # Phase 2: async API tests
    "httpx>=0.27",
    "types-pyyaml>=6.0.12.20261103",
    "types-jsonschema>=4.26.0.20261006",
    "types-croniter>=6.2.4.20261006",
]

[project.scripts]
nuroflow-api = "nuroflow.api.server:run"
nuroflow = "nuroflow.cli:main"
nuroflow-worker = "nuroflow.workers.cli:run"
nuroflow-scheduler = "nuroflow.scheduler.cli:run"

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/nuroflow"]

# --------------------------------------------------------------------------- #
# Ruff — lint + format (replaces black, isort, flake8, pyupgrade)
# --------------------------------------------------------------------------- #
[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E", "W", "F",   # pycodestyle + pyflakes
    "I",             # isort
    "B",             # bugbear
    "UP",            # pyupgrade
    "S",             # bandit (security)
    "N",             # pep8-naming
    "SIM",           # simplify
    "RUF",           # ruff-specific
    "DTZ",           # no naive datetimes
    "PT",            # pytest style
    "TID",           # tidy imports
]
ignore = [
    "S101",  # asserts are used for type narrowing
    "N818",  # domain-language exception names (NotFound, Conflict) read better than *Error
]

[tool.ruff.lint.per-file-ignores]
"alembic/versions/*.py" = ["E501"]
"tests/**/*.py" = ["S", "DTZ"]

[tool.ruff.lint.isort]
known-first-party = ["nuroflow", "tests"]

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

# --------------------------------------------------------------------------- #
# mypy — strict: DI mistakes become type errors, not production incidents
# --------------------------------------------------------------------------- #
[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"
packages = ["nuroflow"]
plugins = ["pydantic.mypy"]
warn_unreachable = true

# Celery and kombu ship without type hints. Treat them as Any at the boundary and keep
# strict checking everywhere else.
[[tool.mypy.overrides]]
module = ["celery", "celery.*", "kombu", "kombu.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["nuroflow.workers.celery_app", "nuroflow.workers.app_factory"]
disallow_untyped_decorators = false
disallow_untyped_calls = false

# --------------------------------------------------------------------------- #
# pytest
# --------------------------------------------------------------------------- #
[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra --strict-markers --strict-config"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
markers = [
    "integration: requires a running PostgreSQL (set NUROFLOW_DATABASE_URL)",
]
filterwarnings = ["error"]

[tool.coverage.run]
source = ["nuroflow"]
branch = true
# SQLAlchemy async resumes code inside greenlets; without this, lines after an
# `await session...` call are silently reported as uncovered.
concurrency = ["greenlet", "thread"]

[tool.coverage.report]
show_missing = true
skip_covered = true
exclude_also = ["if TYPE_CHECKING:", "raise NotImplementedError", "\\.\\.\\."]
