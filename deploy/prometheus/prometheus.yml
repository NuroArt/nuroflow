# Scrape config for local development (`make observe`). The app runs on the host,
# so targets use host.docker.internal (mapped to the host gateway in compose).
global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: nuroflow-api
    metrics_path: /metrics
    # When NUROFLOW_METRICS_TOKEN is set (required when deployed):
    # authorization: { credentials_file: /etc/prometheus/metrics-token }
    static_configs:
      - targets: ["host.docker.internal:8000"]

  - job_name: nuroflow-worker     # Celery parent: aggregates all prefork children
    static_configs:
      - targets: ["host.docker.internal:9101"]

  - job_name: nuroflow-scheduler
    static_configs:
      - targets: ["host.docker.internal:9102"]
