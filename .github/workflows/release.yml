# Release: pushing a tag like v1.2.3 publishes signed, scanned images to GHCR.
#
#   git tag -a v1.0.0 -m "NuroFlow 1.0.0" && git push origin v1.0.0
#
# Images get semver tags plus the commit SHA, an SBOM, and a SLSA build-provenance
# attestation (verify with: gh attestation verify oci://ghcr.io/<owner>/nuroflow-backend:1.0.0 -o <owner>).
name: Release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read

jobs:
  publish:
    name: Publish ${{ matrix.image }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write           # push to ghcr.io
      id-token: write           # keyless signing for provenance
      attestations: write
    strategy:
      matrix:
        include:
          - image: nuroflow-backend
            context: backend
          - image: nuroflow-web
            context: frontend
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: docker/setup-buildx-action@6524bf65af31da8d45b59e8c27de4bd072b392f5 # v3.8.0
      - uses: docker/login-action@9780b0c442fbb1117ed29e0efdff1e18412f7567 # v3.3.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@369eb591f429131d6889c46b94e711f089e6ca96 # v5.6.1
        with:
          images: ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=short
      # Scan before publishing: a release with a known fixable HIGH/CRITICAL never ships.
      - name: Build for scanning
        uses: docker/build-push-action@48aba3b46d1b1fec4febb7c5d0c644b249a11355 # v6.10.0
        with:
          context: ${{ matrix.context }}
          load: true
          tags: scan:${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.image }}
      - name: CVE scan (fail on fixable HIGH/CRITICAL)
        run: deploy/scan-image.sh scan:${{ github.sha }}
      - id: push
        name: Build and push (multi-arch, SBOM)
        uses: docker/build-push-action@48aba3b46d1b1fec4febb7c5d0c644b249a11355 # v6.10.0
        with:
          context: ${{ matrix.context }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          sbom: true
          provenance: mode=max
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}
      - uses: actions/attest-build-provenance@7668571508540a607bdfd90a87a560489fe372eb # v2.1.0
        with:
          subject-name: ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
