# CI: every push and PR runs the full quality gate. A weekly scheduled run rebuilds and
# rescans the images, so newly published CVEs in base images are caught even when no
# code changed.
#
# Supply chain: every third-party action is pinned to a commit SHA (a tag can be
# re-pointed by an attacker; a SHA can't). Dependabot keeps the pins current.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 6 * * 1"        # Mondays 06:17 UTC: rebuild and rescan
  workflow_dispatch:

permissions:
  contents: read                # least privilege; jobs widen only what they need

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  UV_FROZEN: "1"
  PYTHON_VERSION: "3.12"

jobs:
  backend:
    name: Backend (lint, types, tests ≥85% coverage, migrations)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16.6-alpine
        env:
          POSTGRES_USER: nuroflow
          POSTGRES_PASSWORD: nuroflow
          POSTGRES_DB: nuroflow
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U nuroflow" --health-interval 5s
          --health-timeout 3s --health-retries 20
      redis:
        image: redis:7.4-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s
          --health-timeout 3s --health-retries 20
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - run: uv python install ${{ env.PYTHON_VERSION }}
      - run: uv sync
      - name: Lint
        run: uv run ruff check . && uv run ruff format --check .
      - name: Type check
        run: uv run mypy
      - name: Tests (coverage gate in pyproject.toml)
        run: uv run pytest --cov --cov-report=term-missing --cov-report=xml
      - name: Migrations match the models
        run: uv run alembic upgrade head && uv run alembic check
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: coverage-xml
          path: backend/coverage.xml
          retention-days: 14

  frontend:
    name: Dashboard (types, tests, build)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run lint
      - run: npm test
      - run: npm run build

  security:
    name: Security (dependencies, secrets)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0          # gitleaks scans the whole history
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - name: Python dependencies (pip-audit)
        working-directory: backend
        run: |
          uv export --no-dev --no-hashes --no-emit-project --format requirements-txt > /tmp/requirements.txt
          uvx pip-audit --strict -r /tmp/requirements.txt
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: Shipped JS dependencies (npm audit)
        working-directory: frontend
        # Gate on what reaches users. Dev-tool advisories are handled by Dependabot PRs.
        run: npm audit --omit=dev --audit-level=high
      - name: Secrets in history (gitleaks)
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  images:
    name: Images (build, CVE scan, production smoke test)
    needs: [backend, frontend]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build backend
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: backend
          load: true
          tags: nuroflow-backend:ci
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend
      - name: Build web
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: frontend
          load: true
          tags: nuroflow-web:ci
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web
      - name: CVE scan backend (fail on fixable HIGH/CRITICAL)
        run: deploy/scan-image.sh nuroflow-backend:ci
      - name: CVE scan web
        run: deploy/scan-image.sh nuroflow-web:ci
      - name: Start the production stack
        env:
          NUROFLOW_TAG: ci
        run: |
          python3 deploy/generate-secrets.py > .env.prod
          docker compose --env-file .env.prod up -d --wait --wait-timeout 180
      - name: Smoke test through the public edge
        env:
          NUROFLOW_TAG: ci
        run: |
          export SMOKE_PASSWORD="$(python3 -c 'import secrets; print(secrets.token_urlsafe(18))')"
          docker compose --env-file .env.prod run --rm -e NUROFLOW_ADMIN_PASSWORD="$SMOKE_PASSWORD" \
            api nuroflow create-admin --email smoke@nuroworks.com
          BASE_URL=http://localhost:8080 SMOKE_EMAIL=smoke@nuroworks.com python3 deploy/smoke.py
      # Only meaningful once the stack was started: if an earlier step (e.g. the CVE
      # scan) failed, .env.prod doesn't exist and these must not add noise.
      - name: Service logs on failure
        if: failure() && hashFiles('.env.prod') != ''
        run: docker compose --env-file .env.prod logs --tail=200
      - name: Tear down
        if: always() && hashFiles('.env.prod') != ''
        run: docker compose --env-file .env.prod down -v
